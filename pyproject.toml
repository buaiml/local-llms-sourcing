[project]
name = "local-llms-sourcing"
version = "0.1.0"
description = "Benchmark local LLMs on your hardware and crowdsource the results."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
local-llms = "local_llms_sourcing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llms_sourcing"]
